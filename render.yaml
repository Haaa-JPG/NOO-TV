services:
  - type: web
    name: noo-tv
    runtime: node
    plan: free
    buildCommand: npm install && npx playwright install --with-deps chromium && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENABLE_WORKER
        value: "true"
      - key: ENABLE_CRON
        value: "true"
      - key: CRON_SCHEDULE
        value: "0 */2 * * *"
      - key: CRON_CONCURRENCY
        value: "5"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: STREAM_REFRESH_WINDOW_SECONDS
        value: "1800"
